name: Tests
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Skips intermediate builds and cancels intermediate builds
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  fetch-everything-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.13"
    if: github.event.pull_request.draft == false
    env:
      # Configure a constant location for the uv cache
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Install a specific version of uv.
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Run test with pytest
        run: uv run pytest --cov=fetch-everything --cov-report=xml

      - name: Code coverage reporting
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: "70 80"

      - name: Add title to coverage markdown file
        run: |
          echo '## Fetch Everything Pipeline Coverage' > fetch-everything-coverage-results.md
          echo '---' >> fetch-everything-coverage-results.md
          cat code-coverage-results.md >> fetch-everything-coverage-results.md

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request'
        with:
          header: "Fetch Everything Pipeline Coverage"
          recreate: true
          path: fetch-everything-coverage-results.md

      - name: Minimize uv cache
        run: uv cache prune --ci
