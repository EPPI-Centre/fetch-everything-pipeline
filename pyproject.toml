[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[project]
name = "fetch-everything-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  {name = "Harry Moss", email = "h.moss@ucl.ac.uk"}
]
requires-python = ">=3.13"
dependencies = [
  "fetch-everything-robot"
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.7.0"
]
docs = [
  "mkdocs",
  "mkdocs-include-markdown-plugin",
  "mkdocs-material",
  "mkdocs-mermaid2-plugin>=1.2.1",
  "mkdocstrings",
  "mkdocstrings-python",
  "pygments==2.21.0"
]
test = [
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=6.2.1",
  "pytest-mock>=3.14.1",
  "uvloop>=0.21.0"
]

[project.scripts]
fetch-everything = "fetch_everything_pipeline:main"

[tool.mypy]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest]
addopts = ["--color=yes", "--import-mode=importlib", "--verbose", "-m", "not eval"]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
fix = true
force-exclude = true
target-version = "py313"
lint.ignore = [
  "COM812", # trailing commas (ruff-format recommended)
  "D203", # no-blank-line-before-class
  "D205", # missing-blank-line-after-summary
  "D212", # multi-line-summary-first-line
  "D403", # forcing upper-case - feel free to change @harry
  "D407", # removed dashes lines under sections
  "D417", # argument description in docstring (unreliable)
  "ERA001", # commented-out code - REMOVE THIS OVERRIDE ASAP
  "FIX002", # implicit trust that TODOs are not trivial, or else they would be fixed
  "ISC001" # simplify implicit str concatenation (ruff-format recommended)
]
lint.per-file-ignores = {"tests*" = [
  "ANN001", # No return type annotation
  "ANN003", # Missing type annotation for **kwargs
  "ANN201", # No return type annotation
  "ARG001", # Unused function argument
  "D100", # Missing docstring in public module
  "D103", # Missing docstring in public function
  "E501", # Line too long
  "INP001", # File is part of an implicit namespace package.
  "PLR0913", # Too many arguments in function definition
  "PLR2004", # Magic value used in comparison
  "S101", # Use of `assert` detected,
  "SLF001" # calling private methods directly
]}
lint.select = ["ALL"]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = ["classmethod"]

[tool.uv]
exclude-dependencies = [
  "ecdsa" # Required until https://github.com/mpdavis/python-jose/issues/390 is resolved
]
exclude-newer = "P5D"

[tool.uv.build-backend]
module-root = "fetch-everything"

[tool.uv.sources]
fetch-everything-robot = {git = "https://github.com/destiny-evidence/fetch-everything-robot", rev = "b9159e4120ca66f04818a36434e319d216b28b62"} # pragma: allowlist secret
