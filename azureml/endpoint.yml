$schema: https://azuremlschemas.azureedge.net/latest/batchEndpoint.schema.json
# Becomes https://<name>.<region>.inference.ml.azure.com/jobs, so it must be
# unique within the region.
name: fetch-everything-pipeline
description: Fetch full-text PDFs for a DOI file.
# Batch endpoints only support Entra ID: callers need a token and a workspace
# role that allows invoking batch endpoints.
auth_mode: aad_token
