$schema: https://azuremlschemas.azureedge.net/latest/pipelineComponentBatchDeployment.schema.json
# One deployment per released version of the pipeline component. Create a new
# one for each release, test it by name, then make it the endpoint's default.
name: fetch-everything-v1
endpoint_name: fetch-everything-pipeline
description: Runs version 1 of the eppi_fetch_everything_pipeline pipeline component.
type: pipeline
component: azureml:eppi_fetch_everything_pipeline:1
settings:
  default_compute: azureml:eppi-fetch-everything-cpu
  # Used only when a call doesn't give an output path; calls (ADF) always should.
  default_datastore: azureml:eppi_fetch_everything_datastore
