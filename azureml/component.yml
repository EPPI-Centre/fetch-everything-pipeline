$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: eppi_fetch_everything
display_name: Fetch full texts
description: >-
  Fetch full-text PDFs for a file of DOIs, one per line. Writes results.csv
  (one row per input line) and the PDFs under pdfs/ to the output folder.
version: "7"
is_deterministic: false

environment: azureml:eppi-fetch-everything-env@latest

inputs:
  dois:
    type: uri_file
    description: Text file with one DOI per line.
  key_vault_url:
    type: string
    description: >-
      Key Vault holding the provider keys (openalex-key, elsevier-scopus-key,
      elsevier-scopus-inst-token), e.g. https://<vault>.vault.azure.net/
  mailto:
    type: string
    description: Contact email sent to OpenAlex, Crossref and Unpaywall.
  use_scopus:
    type: boolean
    default: false
    description: Fetch from Scopus too. Off by default and also needs the Scopus key.
  wait_time_openalex:
    type: number
    default: 0
    description: >-
      Seconds to wait after each DOI fetched from OpenAlex. Raise this when
      several jobs share one OpenAlex key.
  wait_time_crossref:
    type: integer
    default: 0
    description: Seconds to wait after each PDF downloaded via Crossref.

outputs:
  results:
    type: uri_folder
    description: results.csv and pdfs/. Set the output mode to upload in the pipeline.

# Settings are passed as environment variables so they
# show up as editable inputs in Azure ML.
# Inputs are substituted into this shell command as text, so string inputs
# are single-quoted and paths double-quoted, each reaching the CLI as one
# argument. A value containing ' would still break out of its quotes.
command: >-
  env KEY_VAULT_URL='${{inputs.key_vault_url}}' MAILTO='${{inputs.mailto}}'
  USE_SCOPUS=${{inputs.use_scopus}}
  WAIT_TIME_OPENALEX=${{inputs.wait_time_openalex}}
  WAIT_TIME_CROSSREF=${{inputs.wait_time_crossref}}
  fetch-pipeline --input "${{inputs.dois}}" --output "${{outputs.results}}"
